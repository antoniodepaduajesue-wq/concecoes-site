<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="estilo">
/* Layout: uma coluna centrada (max 1120px) com secções em faixas; o anel de cinco cores do logótipo é o motivo gráfico. */
:root{
  --bg:#FFFFFF; --surface:#F3F2EF; --ink:#1E2340; --muted:#4A4F63; --line:#E2E0DA;
  --band:#1E2340; --band-ink:#FFFFFF; --band-muted:#C9CBD6; --band-line:#3B4161;
  --accent:#C4472A; --focus:#3767B0;
  --c1:#E0603F; --c2:#EBA937; --c3:#1F9A8A; --c4:#3767B0; --c5:#8A4A9C; --dot:#1E2340;
  --logo-bg:#FFFFFF;
  --map-bg:#EEF0EA; --map-road:#FFFFFF; --map-water:#CFE1EC; --map-park:#D7E8D2;
  --font-display:'Outfit', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --font-body:'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --gutter-l:max(20px, env(safe-area-inset-left, 0px));
  --gutter-r:max(20px, env(safe-area-inset-right, 0px));
}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.6;}
*{box-sizing:border-box}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus); outline-offset:3px; border-radius:6px}
.wrap{max-width:1120px; margin-inline:auto; padding-left:var(--gutter-l); padding-right:var(--gutter-r)}
.a1{stroke:var(--c1)} .a2{stroke:var(--c2)} .a3{stroke:var(--c3)} .a4{stroke:var(--c4)} .a5{stroke:var(--c5)} .pt{fill:var(--dot)}
.d1{background:var(--c1)} .d2{background:var(--c2)} .d3{background:var(--c3)} .d4{background:var(--c4)} .d5{background:var(--c5)} .d6{background:var(--ink)}

/* Cabeçalho */
.topo{padding-block:22px}
.topo .wrap{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.marca{display:flex; align-items:center; gap:12px; text-decoration:none}
.marca small{display:block; font-size:10px; font-weight:600; letter-spacing:.32em; color:var(--muted); line-height:1.2}
.marca strong{display:block; font-family:var(--font-display); font-size:26px; font-weight:600; letter-spacing:-.02em; line-height:1}
.nav{display:flex; gap:6px; flex-wrap:wrap}
.nav a{text-decoration:none; font-weight:500; font-size:15px; padding:10px 14px; border-radius:999px; color:var(--muted)}
.nav a:hover{color:var(--ink); background:var(--surface)}
.nav a.cta{background:var(--ink); color:var(--bg)}
.nav a.cta:hover{background:var(--ink); color:var(--bg); opacity:.9}

/* Destaque */
.hero{padding-block:40px 72px}
.hero .wrap{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:48px; align-items:center}
.eyebrow{font-size:14px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 18px}
h1{font-family:var(--font-display); font-weight:600; font-size:clamp(46px, 7.4vw, 92px); line-height:.98; letter-spacing:-.03em; margin:0 0 24px; text-wrap:balance}
.lead{font-size:clamp(18px, 2vw, 22px); line-height:1.5; color:var(--muted); margin:0 0 30px; max-width:36ch}
.acoes{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:30px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:48px; padding:12px 22px; border-radius:999px; font:600 16px/1.2 var(--font-body); text-decoration:none; border:2px solid var(--ink); cursor:pointer}
.btn-primario{background:var(--ink); color:var(--bg)}
.btn-primario:hover{opacity:.9}
.btn-secundario{background:transparent; color:var(--ink)}
.btn-secundario:hover{background:var(--surface)}
.chips{display:flex; flex-wrap:wrap; gap:8px; list-style:none; padding:0; margin:0}
.chips li{display:flex; align-items:center; gap:8px; padding:7px 14px; border:1.5px solid var(--line); border-radius:999px; font-size:15px; font-weight:500}
.chips .bolinha{width:9px; height:9px; border-radius:50%; flex-shrink:0}
.simbolo-hero{width:100%; max-width:380px; justify-self:end; aspect-ratio:1}
.simbolo-hero svg{width:100%; height:100%; display:block}

/* Secções */
.secao{padding-block:72px; border-top:1px solid var(--line)}
.secao.cinza{background:var(--surface); border-top:none}
h2{font-family:var(--font-display); font-weight:600; font-size:clamp(32px, 4vw, 46px); line-height:1.05; letter-spacing:-.02em; margin:0 0 20px; text-wrap:balance}
.rotulo{font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 12px}
.duas{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:48px; align-items:start}
.texto-longo{white-space:pre-line; color:var(--muted); font-size:18px; margin:0; max-width:62ch}
.cartoes{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:16px; margin-top:28px}
.cartao{background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:10px}
.cartao .bolinha{width:14px; height:14px; border-radius:50%}
.cartao h3{font-family:var(--font-display); font-weight:600; font-size:21px; line-height:1.2; margin:0}
.cartao p{margin:0; color:var(--muted); font-size:16px}
.temas{list-style:none; padding:0; margin:28px 0 0; display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:0 40px}
.temas li{display:flex; align-items:center; gap:14px; padding:16px 0; border-bottom:1px solid var(--line); font-size:19px; font-weight:500}
.temas .bolinha{width:12px; height:12px; border-radius:50%; flex-shrink:0}
.temas li > span[data-campo]{flex:1; min-width:0}
.ficha{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:20px; overflow:hidden; margin:28px 0 0}
.ficha div{background:var(--bg); padding:20px 24px; display:flex; flex-direction:column; gap:4px}
.ficha dt{font-size:13px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.ficha dd{margin:0; font-family:var(--font-display); font-size:21px; font-weight:600; line-height:1.3}
.nota{margin:18px 0 0; color:var(--muted); font-size:16px}
.pessoa{display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap}
.pessoa .avatar{width:72px; height:72px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; flex-shrink:0}
.pessoa .avatar svg{width:48px; height:48px}
.pessoa h3{font-family:var(--font-display); font-size:24px; font-weight:600; margin:0 0 6px}
.pessoa p{margin:0; color:var(--muted); max-width:60ch}
.pessoa > div:last-child{flex:1; min-width:0}

/* Inscrição */
.faixa{background:var(--band); color:var(--band-ink); padding-block:80px}
.faixa h2{color:var(--band-ink)}
.faixa .duas{align-items:center}
.faixa p{color:var(--band-muted); margin:0 0 24px; font-size:18px; max-width:52ch}
.faixa .btn{background:var(--band-ink); color:var(--band); border-color:var(--band-ink); min-height:56px; font-size:17px; padding:14px 28px}
.faixa .btn:hover{opacity:.92}
.em-breve{border:1.5px dashed var(--band-line); border-radius:16px; padding:18px 20px; color:var(--band-muted); font-size:16px; margin-bottom:24px}
.contactos{display:flex; flex-direction:column; gap:12px}
.contacto{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:16px 18px; border:1px solid var(--band-line); border-radius:16px}
.contacto .r{font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--band-muted); width:100%}
.contacto .v{font-family:var(--font-display); font-size:21px; font-weight:600; flex:1; min-width:0; overflow-wrap:anywhere; user-select:all}
.copiar{background:transparent; color:var(--band-ink); border:1.5px solid var(--band-line); border-radius:999px; min-height:44px; padding:8px 16px; font:500 14px var(--font-body); cursor:pointer}
.copiar:hover{border-color:var(--band-muted)}
.rodape{padding-block:32px; font-size:14px; color:var(--muted); border-top:1px solid var(--line); display:flex; flex-direction:column; gap:24px}
.rodape .rodape-logos{display:block}
.rodape-logos img{display:block; width:100%; max-width:960px; height:auto; margin-inline:auto}
.rodape .wrap{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}

/* Separador Investigação */
.nav a[aria-current="page"]{color:var(--ink); background:var(--surface)}
.hero-inv h1{font-size:clamp(38px, 5.6vw, 66px); line-height:1.02}
.pubs{list-style:none; padding:0; margin:28px 0 0; display:flex; flex-direction:column; gap:14px}
.pub{display:grid; grid-template-columns:76px minmax(0,1fr); gap:20px; background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:22px 24px}
.pub-ano{font-family:var(--font-display); font-size:24px; font-weight:600; color:var(--accent); line-height:1.2}
.pub h3{font-family:var(--font-display); font-size:21px; font-weight:600; line-height:1.3; margin:0 0 8px; text-wrap:balance}
.pub p{margin:0; color:var(--muted); font-size:16px}
.pub .revista{font-style:italic}
.pub-acoes{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px}
.pub-link{display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:8px 18px; border-radius:999px; border:1.5px solid var(--ink); font-weight:600; font-size:15px; text-decoration:none; color:var(--ink)}
.pub-link:hover{background:var(--surface)}
.campo-inline{display:flex; flex-direction:column; gap:6px; margin-top:12px}
.campo-inline label{font-size:13px; font-weight:600; color:var(--muted)}
.campo-inline input{font:15px var(--font-body); padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); width:100%}
.tese{border-left:3px solid var(--accent); padding:4px 0 4px 18px; margin:0 0 22px}
.tese .rotulo{margin:0 0 6px}
.tese-titulo{font-family:var(--font-display); font-size:clamp(19px, 2vw, 23px); font-weight:600; line-height:1.3; margin:0; text-wrap:balance}
.ligacoes{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px}
.ligacao-ed{flex:1 1 240px; margin-top:0}
.cartoes.cinco{grid-template-columns:repeat(auto-fit, minmax(190px, 1fr))}
.cartao .rotulo-estudo{font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0}
/* Separador Participar */
.estudos-part{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:16px; margin-top:28px}
.cartao-grande{padding:28px}
.cartao-grande h3{font-size:25px}
.quem{margin-top:10px; padding-top:16px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px}
.quem .rotulo{margin:0}
.quem p{color:var(--ink)}
.passos{list-style:none; padding:0; margin:28px 0 0; display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px}
.passo{border:1px solid var(--line); border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:10px}
.passo-n{width:40px; height:40px; border-radius:50%; background:var(--ink); color:var(--bg); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:18px}
.passo h3{font-family:var(--font-display); font-size:20px; font-weight:600; margin:0}
.passo p{margin:0; color:var(--muted); font-size:16px}
.direitos{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:14px}
.direitos li{display:flex; gap:12px; align-items:flex-start; font-size:17px}
.visto{width:30px; height:30px; border-radius:50%; background:var(--c3); color:#FFFFFF; display:flex; align-items:center; justify-content:center; flex-shrink:0}
.visto svg{width:16px; height:16px}
.etica{margin-top:24px; background:var(--bg); border:1px solid var(--line); border-radius:16px; padding:18px 20px; font-size:15px; color:var(--muted)}
.etica p{margin:0}

/* Separador Informação */
.estudos-part.tres{grid-template-columns:repeat(auto-fit, minmax(260px, 1fr))}
.centros{list-style:none; padding:0; margin:28px 0 0; display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px}
.centro{border:1px solid var(--line); border-radius:16px; padding:16px 18px; display:flex; flex-direction:column; gap:4px; background:var(--bg)}
.centro-cidade{font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.centro-nome{font-family:var(--font-display); font-size:18px; font-weight:600; line-height:1.3}
.centro-destaque{border-color:var(--c3); box-shadow:inset 0 0 0 1px var(--c3)}
.centro-tag{align-self:flex-start; margin-top:6px; font-size:13px; font-weight:600; color:#FFFFFF; background:#1F7F72; border-radius:999px; padding:4px 10px}
.centro .pub-link{margin-top:6px; align-self:flex-start; font-size:14px}
.centro .campo-inline{margin-top:6px}
.apoios{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:14px; margin-top:28px}
.apoio{align-items:flex-start; flex-direction:column; flex-wrap:nowrap; text-align:left}
.apoio .valor{flex:0 0 auto}
.apoio .morada{flex:1 1 auto}
.apoio .pub-link{margin-top:8px}
.noticia-data{font-size:16px}
.noticias-cols{display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:20px; margin-top:28px}
.noticias-col{background:var(--surface); border-radius:20px; padding:24px}
.noticias-col h3{font-family:var(--font-display); font-size:23px; font-weight:600; margin:0 0 6px}
.nauto-nota{margin:0 0 8px; color:var(--muted); font-size:14px}
.nauto{list-style:none; padding:0; margin:12px 0 0; display:flex; flex-direction:column}
.nauto-item{display:flex; flex-direction:column; gap:4px; padding:14px 0; border-top:1px solid var(--line)}
.nauto-item:first-child{border-top:none; padding-top:4px}
.nauto-meta{font-size:13px; font-weight:600; color:var(--muted)}
.nauto-item a{font-weight:600; font-size:17px; line-height:1.4; text-decoration:none; color:var(--ink)}
.nauto-item a:hover{text-decoration:underline}
.nauto-vazio{color:var(--muted); font-size:16px; padding:8px 0}
.nauto-vazio a{color:var(--ink); font-weight:600}
.nfixas-titulo{font-family:var(--font-display); font-size:21px; margin:36px 0 0}
@media (max-width: 760px){ .noticias-cols{grid-template-columns:minmax(0,1fr)} .noticias-col{padding:20px} }
.pub .noticia-data + div h3{margin-top:0}

/* Separador Contactos */
.contactos-grelha{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.35fr); gap:28px; align-items:stretch}
.contactos-lista{display:flex; flex-direction:column; gap:14px}
.cartao-contacto{background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:20px 22px; display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px}
.cartao-contacto .rotulo{width:100%; margin:0}
.cartao-contacto .valor{font-family:var(--font-display); font-size:23px; font-weight:600; flex:1 1 auto; min-width:0; overflow-wrap:anywhere; user-select:all}
.cartao-contacto .morada{width:100%; margin:0; white-space:pre-line; color:var(--muted); font-size:16px}
.copiar-claro{background:transparent; color:var(--ink); border:1.5px solid var(--line); border-radius:999px; min-height:44px; padding:8px 16px; font:500 14px var(--font-body); cursor:pointer}
.copiar-claro:hover{border-color:var(--ink)}
.mapa-coluna{display:flex; flex-direction:column}
.mapa{position:relative; display:block; flex:1 1 auto; min-height:320px; border-radius:20px; overflow:hidden; border:1px solid var(--line); text-decoration:none; color:var(--ink)}
.mapa svg{position:absolute; inset:0; width:100%; height:100%; display:block}
a.mapa:hover .mapa-botao{transform:translateY(-1px)}
.m-fundo{fill:var(--map-bg)} .m-rio{fill:none; stroke:var(--map-water); stroke-width:26; stroke-linecap:round}
.m-parque{fill:var(--map-park)} .m-rua{fill:none; stroke:var(--map-road); stroke-width:12; stroke-linecap:round}
.m-grande{stroke-width:20} .m-fina{stroke-width:6}
.m-pino{fill:var(--c1)} .m-pino-centro{fill:var(--map-bg)} .m-sombra{fill:var(--ink); opacity:.18}
.mapa-etiqueta{position:absolute; left:50%; top:calc(50% + 46px); transform:translateX(-50%); background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-weight:600; font-size:15px; white-space:nowrap}
.mapa-botao{position:absolute; right:16px; bottom:16px; display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:10px 18px; border-radius:999px; background:var(--ink); color:var(--bg); font-weight:600; font-size:15px; transition:transform .15s}
@media (max-width: 760px){ .contactos-grelha{grid-template-columns:minmax(0,1fr)} .mapa{min-height:320px} .mapa-botao{left:16px; justify-content:center} .mapa-etiqueta{top:calc(50% + 34px)} }

.perfil{margin:22px 0 0; font-size:16px; color:var(--muted)}
.perfil a{color:var(--ink); font-weight:600}
.financiamento{background:var(--logo-bg); border-radius:16px; padding:18px 22px; margin-top:36px}
.financiamento img{display:block; width:100%; height:auto}


/* Ilustrações */
.ilustra-hero{width:100%; max-width:440px; justify-self:end}
.ilustra-hero svg{width:100%; height:auto; display:block}
.ilustra-inicio{max-width:520px}
.ilustra-sobre{max-width:400px; margin-top:28px}
.ilustra-sobre svg{width:100%; height:auto; display:block}
.cartao-tom{border:none}
.cartao-tom.t0{background:#FBE5DE} .cartao-tom.t1{background:#FBF0D8} .cartao-tom.t2{background:#DCEFEC} .cartao-tom.t3{background:#E2E9F5}
.cartao-tom p{color:#3E4358}
.cartao-icone{display:block; width:96px; height:80px; margin-bottom:4px}
.cartao-icone svg{width:100%; height:100%; display:block}
@media (max-width: 760px){
  .ilustra-hero{order:-1; max-width:340px; justify-self:center}
  .ilustra-sobre{max-width:320px}
}


.orientacao{display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; margin-top:4px}
.orientador{display:flex; gap:18px; align-items:flex-start; background:var(--bg); border-radius:20px; padding:22px 24px; border:1px solid var(--line)}
.orientador.o0{border-top:4px solid var(--c4)} .orientador.o1{border-top:4px solid var(--c1)}
.orientador-icone{flex:0 0 64px; width:64px; height:64px; border-radius:50%; background:var(--surface); overflow:hidden; display:block}
.orientador-icone svg{width:100%; height:100%; display:block}
.orientador h3{font-family:var(--font-display); font-size:21px; font-weight:600; margin:4px 0 8px}
.orientador p{margin:0; color:var(--muted); font-size:16px}
.orientador .rotulo-estudo{font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.orientador > div{flex:1; min-width:0}
@media (max-width: 760px){ .orientacao{grid-template-columns:minmax(0,1fr)} .orientador{flex-direction:column} }

.faixa [data-campo][contenteditable]{outline-color:var(--band-muted)}

.adicionar{margin-top:14px}
.campo-link{display:flex; flex-direction:column; gap:8px; margin-bottom:24px; padding:16px; border:1.5px dashed var(--band-muted); border-radius:16px}

.campo-link small{color:var(--band-muted); font-size:13px}
.barra{position:fixed; right:0; bottom:0; left:0; z-index:20; pointer-events:none; padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px)); padding-left:var(--gutter-l); padding-right:var(--gutter-r); display:flex; justify-content:flex-end}

  function cor(i){ return 'd' + ((i % 6) + 1); }
  function lista(nome, render){
    return (get(nome) || []).map(function(_, i){ return render(i); }).join('');

  var VISTAS = { investigacao: 'investigacao', publicacoes: 'investigacao', contactos: 'contactos', participar: 'participar', 'como-funciona': 'participar', informacao: 'informacao', 'centros-pma': 'informacao', 'centros-privados': 'informacao', noticias: 'informacao' };
  // Notícias automáticas: vêm de noticias.json, atualizado 4 vezes por dia por uma tarefa no GitHub que lê o Google Notícias.
  var NOTICIAS = null, NOTICIAS_PEDIDO = false;
  function urlNoticias(){
    var h = location.hostname;
    return (/(^|\.)concecoes\.pt$/.test(h) || /\.pages\.dev$/.test(h)) ? '/noticias.json' : 'https://concecoes.pt/noticias.json';
  }
  function dataPT(iso){
    var d = new Date(iso); if (isNaN(d)) return '';
    return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
  }
  function noticiasAuto(k){
    var itens = NOTICIAS && NOTICIAS[k];
    if (itens && itens.length) return itens.map(function(n){
      return '<li class="nauto-item"><span class="nauto-meta">' + esc(dataPT(n.data)) + (n.fonte ? ' · ' + esc(n.fonte) : '') + '</span>' +
        (linkValido(n.link) ? '<a href="' + esc(n.link) + '" target="_blank" rel="noopener">' + esc(n.titulo) + ' <span aria-hidden="true">↗</span></a>' : esc(n.titulo)) + '</li>';
    }).join('');
    if (NOTICIAS === null) return '<li class="nauto-vazio">A carregar notícias…</li>';
    if (k === 'portugal') {
      var fixas = get('informacao.noticias') || [];
      if (fixas.length) return fixas.map(function(n){
        return '<li class="nauto-item"><span class="nauto-meta">' + esc(n.data) + (n.fonte ? ' · ' + esc(n.fonte) : '') + '</span>' +
          (linkValido(n.link) ? '<a href="' + esc(n.link.trim()) + '" target="_blank" rel="noopener">' + esc(n.titulo) + ' <span aria-hidden="true">↗</span></a>' : esc(n.titulo)) + '</li>';
      }).join('');
    }
    return '<li class="nauto-vazio">Não foi possível carregar as notícias agora. Visite <a href="https://concecoes.pt/#noticias">concecoes.pt</a> para as ver atualizadas.</li>';
  }
  function notaNoticias(){
    if (NOTICIAS && NOTICIAS.atualizado) return 'Notícias recolhidas automaticamente do Google Notícias sobre PMA, gestação de substituição, infertilidade, adoção e famílias LGBTQIA+. Última atualização: ' + esc(dataPT(NOTICIAS.atualizado)) + '. A seleção é automática e não reflete a opinião do projeto.';
    return 'Notícias recolhidas automaticamente do Google Notícias. A seleção é automática e não reflete a opinião do projeto.';
  }
  function preencherNoticias(){
    var ls = document.querySelectorAll('[data-nauto]');
    for (var i = 0; i < ls.length; i++) ls[i].innerHTML = noticiasAuto(ls[i].getAttribute('data-nauto'));
    var nota = document.querySelector('[data-nauto-atual]'); if (nota) nota.innerHTML = notaNoticias();
  }
  function carregarNoticias(){
    if (NOTICIAS_PEDIDO) return; NOTICIAS_PEDIDO = true;
    var fim = function(d){ NOTICIAS = d; preencherNoticias(); };
    try {
      fetch(urlNoticias(), { cache: 'no-cache' })
        .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(d){ fim((d && (d.portugal || d.mundo)) ? d : false); })
        .catch(function(){ fim(false); });
    } catch (e) { fim(false); }
  }

  function render(){

        '<small>Cole aqui o link do Google Forms (ou de outro formulário). Sem link, o site mostra a mensagem abaixo.</small></div>' +
        '<p style="margin:0 0 6px;font-size:14px">Texto do botão:</p><p style="margin:0 0 18px">' + t('inscricao.botao') + '</p>' +
        '<div class="em-breve">' + t('inscricao.emBreve') + '</div>';
    }

    var v = vista(), naInv = v === 'investigacao', naCont = v === 'contactos', naPart = v === 'participar', naInfo = v === 'informacao';
    var cabecalho =
    '<header class="topo"><div class="wrap">' +
      '<a class="marca" href="#inicio" aria-label="Projeto Conceções, início">' + simbolo('', '').replace('<svg', '<svg width="44" height="44"') +
      '<span><small>PROJETO</small><strong>Conceções</strong></span></a>' +
      '<nav class="nav" aria-label="Secções"><a href="#sobre">Sobre</a><a href="#temas">Temas</a><a href="#encontros">Quando e onde</a><a href="#investigacao"' + (naInv ? ' aria-current="page"' : '') + '>Investigação</a><a href="#participar"' + (naPart ? ' aria-current="page"' : '') + '>Participar no estudo</a><a href="#informacao"' + (naInfo ? ' aria-current="page"' : '') + '>Informação</a><a href="#contactos"' + (naCont ? ' aria-current="page"' : '') + '>Contactos</a><a class="cta" href="#inscricao">Inscrição</a></nav>' +
    '</div></header>';

    var principal =
    '<main id="inicio">' +
    '<section class="hero"><div class="wrap">' +
      '<div>' +
        '<p class="eyebrow">' + t('eyebrow') + '</p>' +
        '<h1>' + t('titulo') + '</h1>' +
        '<p class="lead">' + t('lead') + '</p>' +
        '<div class="acoes"><a class="btn btn-primario" href="#inscricao">Quero inscrever-me</a><a class="btn btn-secundario" href="#sobre">Saber mais</a></div>' +
        '<ul class="chips" aria-label="A quem se destina">' + lista('chips', function(i){ return '<li><span class="bolinha ' + cor(i) + '"></span>' + t('chips.' + i) + remover('chips', i, s.chips[i]) + '</li>'; }) +
        (editing ? '<li><button type="button" class="mini" data-acao="adicionar" data-lista="chips">+ Etiqueta</button></li>' : '') + '</ul>' +
      '</div>' +
      '<div class="ilustra-hero ilustra-inicio">' + ILUS.familias() + '</div>' +
    '</div></section>' +

    '<section class="secao cinza" id="sobre"><div class="wrap">' +
      '<div class="duas"><div><h2>' + t('sobreTitulo') + '</h2><div class="ilustra-sobre">' + ILUS.conversa() + '</div></div>' + t('sobreTexto', 'p', 'texto-longo', true) + '</div>' +
      '<h3 class="rotulo" style="margin-top:48px">' + t('paraQuemTitulo') + '</h3>' +
      '<div class="cartoes">' + lista('paraQuem', function(i){ var ic = ['desejo', 'filhos', 'solteiros', 'todas'][i]; return '<article class="cartao cartao-tom t' + (i % 4) + '">' + (ic ? '<span class="cartao-icone" aria-hidden="true">' + ILUS[ic]() + '</span>' : '<span class="bolinha ' + cor(i) + '"></span>') + '<h3>' + t('paraQuem.' + i + '.titulo') + '</h3>' + t('paraQuem.' + i + '.texto', 'p') + '</article>'; }) + '</div>' +
    '</div></section>' +

    '<section class="secao" id="temas"><div class="wrap">' +
      '<h2>' + t('temasTitulo') + '</h2>' +
      '<ul class="temas">' + lista('temas', function(i){ return '<li><span class="bolinha ' + cor(i) + '"></span>' + t('temas.' + i) + remover('temas', i, s.temas[i]) + '</li>'; }) + '</ul>' +
      (editing ? '<button type="button" class="mini adicionar" data-acao="adicionar" data-lista="temas">+ Adicionar tema</button>' : '') +
    '</div></section>' +

    '<section class="secao cinza" id="encontros"><div class="wrap">' +
      '<h2>' + t('encontrosTitulo') + '</h2>' +
      '<dl class="ficha">' + ficha + '</dl>' +
      '<p class="nota">' + t('encontroNota') + '</p>' +
      '<div class="pessoa" style="margin-top:48px"><div class="avatar">' + simbolo('', '') + '</div><div>' +
        '<p class="rotulo">' + t('dinamizacaoTitulo') + '</p><h3>' + t('dinamizacao.nome') + '</h3>' + t('dinamizacao.texto', 'p') +
        '<div class="ligacoes" style="margin-top:16px">' + (get('dinamizacao.links') || []).map(function(l, i){
          var p = 'dinamizacao.links.' + i;
          if (editing) return '<div class="campo-inline ligacao-ed"><label for="din-link-' + i + '">' + esc(l.rotulo) + '</label><input id="din-link-' + i + '" type="url" placeholder="https://" data-input="' + p + '.link" value="' + esc(l.link) + '"></div>';
          return linkValido(l.link) ? '<a class="pub-link" href="' + esc(l.link.trim()) + '" target="_blank" rel="noopener">' + esc(l.rotulo) + ' <span aria-hidden="true">↗</span></a>' : '';
        }).join('') + '</div>' +
      '</div></div>' +
      '<p class="rotulo" style="margin-top:44px">' + t('orientacaoTitulo') + '</p>' +
      '<div class="orientacao">' + (get('orientacao') || []).map(function(o, i){
        var p = 'orientacao.' + i, ic = i % 2 ? busto(40, 76, 40, COR.t, PELE[1], CAB[1], 'longo') : busto(40, 76, 40, COR.a, PELE[0], CAB[0], 'curto');
        return '<article class="orientador o' + i + '"><span class="orientador-icone" aria-hidden="true">' + svgIl('0 0 80 80', ic, '') + '</span><div>' +

                   : (linkValido(o.link) ? '<div class="pub-acoes"><a class="pub-link" href="' + esc(o.link.trim()) + '" target="_blank" rel="noopener">' + esc(o.rotuloLink) + ' <span aria-hidden="true">↗</span></a></div>' : '')) +

    '<section class="faixa" id="inscricao"><div class="wrap"><div class="duas">' +

      '<div class="contactos">' +
        '<div class="contacto"><span class="r">E-mail</span><span class="v">' + t('inscricao.email') + '</span><button type="button" class="copiar" data-copiar="inscricao.email">Copiar</button></div>' +
        '<div class="contacto"><span class="r">Telemóvel</span><span class="v">' + t('inscricao.telemovel') + '</span><button type="button" class="copiar" data-copiar="inscricao.telemovel">Copiar</button></div>' +
      '</div>' +
    '</div></div></section>' +
    '</main>';

    var rodape = '<footer class="rodape"><div class="wrap rodape-logos"><img src="' + LOGOS + '" alt="Instituições de acolhimento: Universidade da Beira Interior, CIDESD e CooLabora. Financiamento 2024.01020.BDANA: FCT, Pessoas 2030 e Portugal 2030"></div><div class="wrap"><span>Projeto Conceções · CooLabora, Covilhã</span>' + t('rodape') + '</div></footer>';
    app.innerHTML = cabecalho + (naInv ? investigacaoHTML() : naCont ? contactosHTML() : naPart ? participarHTML() : naInfo ? informacaoHTML() : principal) + rodape;
    document.body.classList.toggle('editando', editing);
    if (naInfo) carregarNoticias();
  }

  function renderBarra(msg){
    if (!canEdit) { barra.hidden = true; return; }
    barra.hidden = false;
    if (!editing) {
      barra.innerHTML = '<div class="barra-in so-botao"><button type="button" class="btn btn-primario" data-acao="editar" style="background:var(--ink);color:var(--bg);border-color:var(--ink)">Editar página</button></div>';
      return;
    }
    barra.innerHTML = '<div class="barra-in"><p role="status">' + esc(msg || (dirty ? 'Tem alterações por guardar.' : 'Modo de edição: clique num texto para o alterar.')) + '</p>' +
      '<button type="button" class="btn btn-secundario" data-acao="cancelar"' + (saving ? ' disabled' : '') + '>Cancelar</button>' +
      '<button type="button" class="btn btn-primario" data-acao="guardar"' + (saving ? ' disabled' : '') + '>' + (saving ? 'A guardar…' : 'Guardar alterações') + '</button></div>';
  }

  function documento(){
    var json = JSON.stringify(state).replace(/</g, '\\u003c');
    var head = '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">';
    return SKELETON +
      '<title>Projeto Conceções</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' + head + '\n' +
      '<style id="estilo">' + document.getElementById('estilo').textContent + '</style>\n' +
      '<div id="app"></div>\n<div id="barra" class="barra" hidden></div>\n' +
      '<script type="application/json" id="conteudo">' + json + '<\/script>\n' +
      '<script id="motor">' + document.getElementById('motor').textContent + '<\/script>\n' +
      '</body></html>';
  }

  async function guardar(){
    if (!artifactApi || saving) return;
    saving = true; renderBarra();
    try {
      await artifactApi.publish(documento());
      renderBarra('Guardado. A página vai recarregar…');
    } catch (err) {
      saving = false;
      var c = err && err.code;
      if (c === 'conflict') { renderBarra('Foi guardada outra versão entretanto. A página vai recarregar.'); return; }
      if (c === 'not_writer' || c === 'not_granted' || c === 'not_declared' || c === 'consent_required' || c === 'capability_disabled' || c === 'capability_removed') {
        canEdit = false; editing = false; render(); renderBarra(); return;
      }
      if (c === 'rate_limited') { renderBarra('Guardou várias vezes seguidas. Aguarde um minuto e tente outra vez.'); return; }
      if (c === 'too_large') { renderBarra('A página ficou demasiado grande para guardar. Encurte algum texto.'); return; }
      renderBarra('Não foi possível guardar agora. Tente outra vez daqui a pouco.');
    }
  }

  app.addEventListener('input', function(ev){
    var el = ev.target;
    if (el.id === 'campo-link') { state.inscricao.link = el.value.trim(); dirty = true; renderBarra(); return; }
    if (el.dataset && el.dataset.input) { set(el.dataset.input, el.value.trim()); dirty = true; renderBarra(); return; }
    var campo = el.closest && el.closest('[data-campo]');
    if (!campo || !editing) return;
    var v = campo.innerText.replace(/ /g, ' ');
    v = campo.dataset.multi ? v.replace(/\n{3,}/g, '\n\n').replace(/\s+$/, '') : v.replace(/\s*\n\s*/g, ' ').trim();
    set(campo.dataset.campo, v);
    if (!dirty) { dirty = true; renderBarra(); }
  });
  app.addEventListener('keydown', function(ev){
    var campo = ev.target.closest && ev.target.closest('[data-campo]');
    if (campo && editing && ev.key === 'Enter' && !campo.dataset.multi) { ev.preventDefault(); }
  });
  app.addEventListener('click', function(ev){
    var b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.copiar) {
      var txt = get(b.dataset.copiar);
      var ok = function(){ b.textContent = 'Copiado'; setTimeout(function(){ b.textContent = 'Copiar'; }, 1600); };
      var falha = function(){ var v = b.parentNode.querySelector('.v, .valor'); if (v) { var r = document.createRange(); r.selectNodeContents(v); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } b.textContent = 'Selecionado'; setTimeout(function(){ b.textContent = 'Copiar'; }, 1600); };
      try { navigator.clipboard.writeText(txt).then(ok, falha); } catch(e){ falha(); }
      return;
    }
    if (b.dataset.acao === 'remover') { get(b.dataset.lista).splice(+b.dataset.i, 1); dirty = true; render(); renderBarra(); return; }
    if (b.dataset.acao === 'adicionar') {
      var arr = get(b.dataset.lista), novo = NOVOS[b.dataset.lista];
      arr.push(typeof novo === 'object' ? JSON.parse(JSON.stringify(novo)) : (novo || 'Novo item')); dirty = true; render(); renderBarra();
      var els = app.querySelectorAll('[data-campo^="' + b.dataset.lista + '."]');
      var last = app.querySelector('[data-campo="' + b.dataset.lista + '.' + (arr.length - 1) + '.titulo"]') || els[els.length - 1];
      if (last) { last.focus(); try { var r = document.createRange(); r.selectNodeContents(last); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch(e){} }
      return;
    }
  });
  barra.addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.acao === 'editar') { editing = true; dirty = false; render(); renderBarra(); return; }
    if (b.dataset.acao === 'cancelar') { state = JSON.parse(JSON.stringify(ORIGINAL)); editing = false; dirty = false; render(); renderBarra(); return; }
    if (b.dataset.acao === 'guardar') { guardar(); }
  });

  render();

  var vistaAtual = vista();
  window.addEventListener('hashchange', function(){
    var v = vista(), id = location.hash.slice(1);
    if (v !== vistaAtual) {
      vistaAtual = v; render();
      if (!id || id === 'investigacao' || id === 'contactos' || id === 'participar' || id === 'informacao' || id === 'inicio') { window.scrollTo(0, 0); return; }
    }
    var el = id && document.getElementById(id);
    if (el) el.scrollIntoView();
  });

  if (window.claude && typeof window.claude.use === 'function') {
    Promise.all([window.claude.use('user'), window.claude.use('artifact')]).then(function(r){
      var user = r[0]; artifactApi = r[1];
      if (!user || !artifactApi) return;
      return user.canEdit().then(function(ok){ canEdit = !!ok; renderBarra(); });
    }).catch(function(){});
  }
})();
