name: Atualizar notícias

on:
  schedule:
    - cron: "17 5,11,17,23 * * *"   # quatro vezes por dia
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recolher notícias
        run: python scripts/atualizar_noticias.py noticias.json
      - name: Guardar se houver novidades
        run: |
          if [ -n "$(git status --porcelain noticias.json)" ]; then
            git config user.name "concecoes-noticias"
            git config user.email "concecoes-noticias@users.noreply.github.com"
            git add noticias.json
            git commit -m "Atualizar notícias"
            git push
          else
            echo "Sem alterações."
          fi
